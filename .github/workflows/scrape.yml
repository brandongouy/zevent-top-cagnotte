# resync 2026-09-05
name: Scrape ZEvent Streamers

permissions:
  contents: write

concurrency:
  group: scrape-zevent
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Mise en cache du dossier des navigateurs Playwright
      - name: Cache des binaires Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      # 2. Installation de Chromium uniquement si le cache est vide
      - name: Installer Chromium et dépendances système
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      # 3. Réinstallation des dépendances système légères si le cache existe déjà
      - name: Installer les dépendances système uniquement
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Exécuter le scraper
        run: python scrapezevent.py

      - name: Commit et Push des modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streamers.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "bot: Mise à jour automatique des données"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "Aucun changement à committer."
          fi
